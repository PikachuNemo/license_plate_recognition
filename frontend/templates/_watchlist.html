{% macro watchlist() %}
<div class="card">
    <div class="header-container">
        <h2>Watchlist</h2>
    </div>

    <div id="watchlist-display" class="watchlist-container"></div>

    <div class="form-group watchlist-input-group">
        <input type="text" id="watchlist-input" placeholder="e.g., B AE 5627" maxlength="9">
        <button id="add-to-watchlist-btn" class="btn-add">Add</button>
        <button id="clear-watchlist-btn" class="btn-clear">Clear</button>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const watchlistInput = document.getElementById('watchlist-input');
        const addBtn = document.getElementById('add-to-watchlist-btn');
        const clearBtn = document.getElementById('clear-watchlist-btn');
        const watchlistDisplay = document.getElementById('watchlist-display');

        const platePattern = /^[A-Z]\s[A-Z]{2}\s\d{4}$/; // New pattern for validation

        // Fetches the watchlist from the server
        const getWatchlist = async () => {
            try {
                const response = await fetch('/watchlist');
                if (response.ok) {
                    const data = await response.json();
                    return data.watchlist;
                } else {
                    console.error('Failed to fetch watchlist:', response.statusText);
                    return [];
                }
            } catch (error) {
                console.error('Error fetching watchlist:', error);
                return [];
            }
        };

        // Renders the watchlist fetched from the server
        const renderWatchlist = async () => {
            watchlistDisplay.innerHTML = '';
            const watchlist = await getWatchlist();
            watchlist.forEach(plate => {
                if (plate) {
                    const plateElement = document.createElement('div');
                    plateElement.className = 'watchlist-item';
                    plateElement.textContent = plate;
                    
                    const removeBtn = document.createElement('span');
                    removeBtn.className = 'remove-plate';
                    removeBtn.textContent = '×';
                    removeBtn.onclick = () => removePlateFromWatchlist(plate);
                    
                    plateElement.appendChild(removeBtn);
                    watchlistDisplay.appendChild(plateElement);
                }
            });
        };

        // Adds a plate to the server-side watchlist
        const addPlateToWatchlist = async () => {
            const plate = watchlistInput.value.trim().toUpperCase();
            if (plate.match(platePattern)) {
                try {
                    const response = await fetch('/watchlist', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ action: 'add', plate: plate })
                    });
                    if (response.ok) {
                        renderWatchlist(); // Re-render after successful update
                        watchlistInput.value = '';
                    } else {
                        const errorData = await response.json();
                        alert('Failed to add plate: ' + (errorData.message || response.statusText));
                    }
                } catch (error) {
                    console.error('Error adding plate:', error);
                    alert('Error adding plate to watchlist.');
                }
            } else {
                alert('Please enter a valid plate number in the format A BB 1234 (e.g., B AE 5627).');
            }
        };

        // Removes a plate from the server-side watchlist
        const removePlateFromWatchlist = async (plateToRemove) => {
            try {
                const response = await fetch('/watchlist', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ action: 'remove', plate: plateToRemove })
                });
                if (response.ok) {
                    renderWatchlist(); // Re-render after successful update
                } else {
                    const errorData = await response.json();
                    alert('Failed to remove plate: ' + (errorData.message || response.statusText));
                }
            } catch (error) {
                console.error('Error removing plate:', error);
                alert('Error removing plate from watchlist.');
            }
        };

        // Clears the server-side watchlist
        const clearWatchlist = async () => {
            try {
                const response = await fetch('/watchlist/clear', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                if (response.ok) {
                    renderWatchlist(); // Re-render after successful clear
                } else {
                    const errorData = await response.json();
                    alert('Failed to clear watchlist: ' + (errorData.message || response.statusText));
                }
            } catch (error) {
                console.error('Error clearing watchlist:', error);
                alert('Error clearing watchlist.');
            }
        };

        addBtn.addEventListener('click', addPlateToWatchlist);
        clearBtn.addEventListener('click', clearWatchlist);

        watchlistInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addPlateToWatchlist();
            }
        });
        
        // Auto-formatting and input filtering
        watchlistInput.addEventListener('input', function(e) {
            let rawValue = this.value.replace(/\s/g, ''); // Remove spaces to get raw characters

            // Enforce character types: 3 letters followed by 4 digits
            let letters = rawValue.substring(0, 3).toUpperCase().replace(/[^A-Z]/g, '');
            let digits = rawValue.substring(3, 7).replace(/[^0-9]/g, '');
            
            let value = letters + digits;

            let formattedValue = '';
            if (value.length > 0) {
                formattedValue += value.substring(0, 1);
            }
            if (value.length > 1) {
                formattedValue += ' ' + value.substring(1, 3);
            }
            if (value.length > 3) {
                formattedValue += ' ' + value.substring(3, 7);
            }
            
            // To avoid infinite loops and handle cursor position correctly
            if (this.value !== formattedValue) {
                let selectionStart = this.selectionStart;
                let change = formattedValue.length - this.value.length;
                this.value = formattedValue;
                this.selectionStart = selectionStart + change > 0 ? selectionStart + change : selectionStart;
                this.selectionEnd = this.selectionStart;
            }
        });

        // Initial render
        renderWatchlist();
    });
</script>
{% endmacro %}
