<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>License Plate Recognition</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="card">
    <h1>License Plate Recognition</h1>
    <form id="upload-form" enctype="multipart/form-data">
      <input type="file" id="image-input" name="image" accept="image/*" required><br>
      <button type="submit">Upload & Recognize</button>
    </form>

    <div id="preview-container"></div>
    <div id="result"></div>
  </div>

  <script>
    const form = document.getElementById('upload-form');
    const resultDiv = document.getElementById('result');
    const previewContainer = document.getElementById('preview-container');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);

      // Show image preview
      const file = form.image.files[0];
      if (file) {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        img.height = 200;
        previewContainer.innerHTML = '';
        previewContainer.appendChild(img);
      }

      // Show spinner while recognizing
      resultDiv.innerHTML = '<div class="spinner"></div><p>Recognizing...</p>';

      try {
        const res = await fetch('/recognize', {
          method: 'POST',
          body: formData
        });

        const data = await res.json();
        if (data.plate) {
          resultDiv.innerHTML = `<strong>Detected Plate:</strong><br><span style="font-size:22px; color:#007bff;">${data.plate}</span>`;
        } else {
          resultDiv.innerHTML = "<span style='color:red;'>No plate detected.</span>";
        }
      } catch (err) {
        resultDiv.innerHTML = "<span style='color:red;'>Error during recognition.</span>";
      }
    });
  </script>
</body>
</html>
