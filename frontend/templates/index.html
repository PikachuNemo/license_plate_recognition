<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>License Plate Recognition</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>License Plate Recognition</h1>
    <form id="upload-form" enctype="multipart/form-data">
      <input type="file" id="image-input" name="image" accept="image/*" required><br>
      <button type="submit">Upload & Recognize</button>
    </form>
    <div id="preview-container"></div>
    <div id="result"></div>
  </div>

  <script>
    const form = document.getElementById('upload-form');
    const resultDiv = document.getElementById('result');
    const previewContainer = document.getElementById('preview-container');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);

      const file = form.image.files[0];
      if (file) {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        img.height = 200;
        previewContainer.innerHTML = '';
        previewContainer.appendChild(img);
      }

      resultDiv.innerHTML = 'Recognizing...';

      const res = await fetch('/recognize', {
        method: 'POST',
        body: formData
      });

      const data = await res.json();
      resultDiv.innerHTML = `<strong>Detected:</strong> ${data.plate}`;
    });
  </script>
</body>
</html>
