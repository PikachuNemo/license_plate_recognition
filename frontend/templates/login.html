<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='1.1') }}">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h1>Login</h1>
        <form action="/login" method="post">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="toggle-container">
                <label for="user-type-toggle">User</label>
                <label class="switch">
                    <input type="checkbox" id="user-type-toggle" name="user_type_toggle">
                    <span class="slider round"></span>
                </label>
                <label for="user-type-toggle">Admin</label>
            </div>
            <button type="submit">Login</button>
            {% if error %}
                <p class="error-message">{{ error }}</p>
            {% endif %}
        </form>
        <p>Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
    </div>
    <script>
        document.getElementById('user-type-toggle').addEventListener('change', function() {
            // This script is just for visual toggle, actual value is determined on server
            // based on whether the checkbox is checked or not.
        });
    </script>
</body>
</html>
